<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Event Guestbook</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{font-family:Arial,system-ui,sans-serif;color:#171717;background:#f7f7f5}
*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}
a{color:inherit}.wrap{max-width:1040px;margin:0 auto;padding:24px 16px 56px}
.card{background:#fff;border:1px solid #e4e4e4;border-radius:20px;overflow:hidden}
.hero{padding:28px;background:#f1eee9}.content{padding:24px}
.row{display:flex;gap:12px;flex-wrap:wrap}.grow{flex:1;min-width:220px}
.field{margin-bottom:18px}.label{display:block;font-weight:700;margin-bottom:8px}.help{font-size:13px;color:#666;margin-top:6px;display:block}
.input,.textarea,.select{width:100%;padding:12px 14px;border:1px solid #ccc;border-radius:12px;background:#fff}.textarea{min-height:120px;resize:vertical}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer;background:#111;color:#fff}.btn.secondary{background:#fff;color:#111;border:1px solid #ccc}.btn.danger{background:#fff;color:#991b1b;border:1px solid #e2bcbc}.btn:disabled{opacity:.5;cursor:not-allowed}
.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:20px;flex-wrap:wrap}.top h1{margin:.1em 0}
.small{font-size:13px;color:#666}.msg{padding:14px;border-radius:12px;background:#f1f1f1;margin-bottom:14px}.err{background:#fff0f0;color:#8a1515}.ok{background:#eef8ef;color:#205b2e}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.event-card{background:#fff;border:1px solid #ddd;border-radius:16px;padding:18px}.event-card h3{margin:0 0 8px}
.badge{display:inline-flex;border-radius:999px;padding:6px 9px;font-size:12px;font-weight:700}.badge.draft{background:#eee}.badge.published{background:#e9f8ed;color:#19642c}.badge.archived{background:#f4e8e8}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.pill{font-size:12px;background:#f3f3f3;border-radius:999px;padding:6px 9px}
.tabs{display:flex;gap:8px;overflow:auto;padding-bottom:8px;margin-bottom:18px}.tab{border:1px solid #ddd;background:#fff;border-radius:999px;padding:9px 13px;white-space:nowrap;cursor:pointer}.tab.active{background:#111;color:#fff;border-color:#111}
.step{display:none}.step.active{display:block}.switchrow{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #eee}.switchrow:last-child{border:0}
.actions{display:flex;justify-content:space-between;gap:10px;margin-top:22px;flex-wrap:wrap}.preview{border:1px dashed #bbb;border-radius:16px;padding:18px;background:#fafafa}
.reactions{display:flex;flex-wrap:wrap;gap:8px}.reaction input{position:absolute;opacity:0}.reaction span{display:inline-block;padding:10px 12px;border:1px solid #ccc;border-radius:12px}.reaction input:checked+span{background:#eee;border-color:#111}
.submission{background:#fff;border:1px solid #ddd;border-radius:16px;padding:18px;margin-bottom:12px}.sub-top{display:flex;justify-content:space-between;gap:10px}.thumb{width:100%;max-height:420px;object-fit:contain;border-radius:12px;background:#f3f3f3;margin-top:10px}
.status.pending{background:#fff7d6;color:#765b00}.status.approved{background:#e9f8ed;color:#19642c}.status.rejected{background:#feecec;color:#8e1e1e}
.auth{max-width:460px;margin:60px auto}.center{text-align:center}.qrbox{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-top:16px}.qr{background:#fff;padding:10px;border:1px solid #ddd;border-radius:12px}
.loading{padding:50px;text-align:center;color:#666}
.personal-card-page{max-width:760px}.personal-card-shell{border-radius:24px}.personal-card-shell>.content{padding:clamp(16px,4vw,32px)}
.personal-card-page h1{margin:4px 0 8px}.personal-card-image{max-width:520px;margin:20px auto 10px}
.card-page{text-align:center;margin-bottom:12px}.card-page .card-preview{max-width:100%;width:100%;margin:0 auto 6px}
.personal-actions{max-width:520px;margin:18px auto 8px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.personal-actions .btn:first-child{grid-column:1/-1}.personal-actions .btn{min-width:0}
.card-notice{max-width:520px;min-height:24px;margin:8px auto;text-align:center;font-size:14px;color:#4c594a}
.card-edit-panel{max-width:520px;margin:22px auto;padding:20px;border:1px solid #e3e3e3;border-radius:16px;background:#fafaf8}
.card-older{max-width:520px;margin:26px auto;border-top:1px solid #eee;padding-top:16px}
.card-older summary{font-weight:700;cursor:pointer;list-style:revert}
.card-version-list{display:flex;gap:10px;overflow-x:auto;padding:15px 0}
.card-version{background:#fff;border:1px solid #ddd;border-radius:12px;padding:8px;min-width:120px;width:120px;cursor:pointer;text-align:center;font-size:12px}
.card-version.current{border:2px solid #222}.card-version img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:6px;display:block;margin-bottom:8px}
.card-private-tools{max-width:520px;margin:32px auto 0;padding-top:18px;border-top:1px solid #eee;display:flex;gap:12px;flex-wrap:wrap}
.card-private-tools p{flex:0 0 100%;margin:0}.card-private-tools .btn.danger{margin-inline-start:auto}
@media(max-width:460px){.personal-actions{grid-template-columns:1fr}.personal-actions .btn:first-child{grid-column:auto}.card-private-tools .btn{flex:1}}
.card-preview{width:100%;max-width:420px;display:block;margin:12px auto;border-radius:12px;box-shadow:0 5px 25px #0002}.card-preview{display:block;width:100%;max-width:420px;margin:12px auto;border-radius:12px;box-shadow:0 5px 25px #0002}.card-controls{max-width:540px;margin:0 auto}.card-controls .field{margin-bottom:13px}.card-controls .row>*{flex:1;min-width:120px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0 18px}.filter{border:1px solid #ddd;background:#fff;border-radius:999px;padding:8px 12px;cursor:pointer}.filter.active{background:#111;color:#fff;border-color:#111}.event-link{direction:ltr;text-align:left;word-break:break-all}.notice{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111;color:#fff;padding:11px 16px;border-radius:999px;z-index:50;box-shadow:0 8px 24px #0003}.muted{opacity:.65}.member{display:flex;justify-content:space-between;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid #eee}.member:last-child{border-bottom:0}.role{background:#eee;border-radius:999px;padding:5px 8px;font-size:12px;font-weight:700}.role.super{background:#efe7ff;color:#5b2b8a}.navrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
@media(max-width:760px){.grid{grid-template-columns:1fr}.wrap{padding-top:14px}.actions .btn{flex:1}.top{align-items:flex-start}}
</style>
</head>
<body>
<main id="app" class="wrap"><div class="loading">טוען...</div></main>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
import { renderGuestCardPage } from '/guest-card-page.js';

const SUPABASE_URL='https://zladqxbnakzgtwrogjfx.supabase.co';
const SUPABASE_KEY='sb_publishable_Jz3ngs_yzwXpCNlTCJO2NA_UDKvi3sZ';
const API=SUPABASE_URL+'/functions/v1/guestbook-demo';
const CARD_API=SUPABASE_URL+'/functions/v1/guest-card';
const supabase=createClient(SUPABASE_URL,SUPABASE_KEY);
const app=document.getElementById('app');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const currentPath=()=>location.pathname.replace(/\/+$/,'')||'/';
const currentQuery=()=>new URLSearchParams(location.search);
const go=p=>{history.pushState({},'',p);route()};
window.addEventListener('popstate',route);

function formatStatus(s){return s==='published'?'פורסם':s==='archived'?'בארכיון':'טיוטה'}
function slugify(s){return String(s||'').toLowerCase().trim().replace(/[^a-z0-9-]+/g,'-').replace(/^-+|-+$/g,'').replace(/-+/g,'-').slice(0,48)}
function localInputValue(iso){if(!iso)return'';const d=new Date(iso);const z=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}T${z(d.getHours())}:${z(d.getMinutes())}`}
function toIso(v){return v?new Date(v).toISOString():null}
async function edge(url,opts){const r=await fetch(url,opts);let j={};try{j=await r.json()}catch{}if(!r.ok)throw new Error(j.error||'אירעה שגיאה');return j}
async function session(){const {data}=await supabase.auth.getSession();return data.session}
let orgContext=null;
async function loadOrgContext(){
  const s=await session();if(!s)return null;
  const {data:claimed,error:claimErr}=await supabase.rpc('claim_my_organization_membership');
  if(claimErr)console.warn(claimErr);
  const {data:member,error}=await supabase.from('organization_members').select('id,organization_id,email,display_name,role,status').eq('user_id',s.user.id).eq('status','active').maybeSingle();
  if(error||!member)return null;
  const [{data:org},{data:settings}]=await Promise.all([
    supabase.from('organizations').select('id,name').eq('id',member.organization_id).maybeSingle(),
    supabase.from('organization_settings').select('*').eq('organization_id',member.organization_id).maybeSingle()
  ]);
  orgContext={session:s,member,org,settings};return orgContext;
}
async function requireOrg(){
  const s=await session();if(!s){renderAuth();return null}
  const c=await loadOrgContext();
  if(!c){
    app.className='wrap auth';
    app.innerHTML='<section class="card"><div class="content center"><h1>אין הרשאה למערכת</h1><p>החשבון מחובר, אבל הוא לא הוגדר כעובד פעיל בארגון.</p><button class="btn secondary" id="noAccessLogout">התנתקות</button></div></section>';
    document.getElementById('noAccessLogout').onclick=async()=>{await supabase.auth.signOut();orgContext=null;go('/manager')};
    return null
  }
  return c
}
async function requireSession(){const c=await requireOrg();return c?.session||null}
function toast(t){const x=document.createElement('div');x.className='notice';x.textContent=t;document.body.appendChild(x);setTimeout(()=>x.remove(),1800)}
async function copyText(t){try{await navigator.clipboard.writeText(t);toast('הקישור הועתק')}catch{prompt('העתק את הקישור:',t)}}
function guestUrl(slug){return location.origin+'/e/'+slug}
function eventOpenState(e){const now=Date.now(),start=new Date(e.submission_start_at).getTime(),end=new Date(e.submission_end_at).getTime();if(e.status!=='published')return'';if(now<start)return'טרם נפתח';if(now>=end)return'נסגר';return'פתוח לקבלת שליחות'}
function downloadQr(containerId,filename='event-qr.png'){const q=document.getElementById(containerId);const canvas=q?.querySelector('canvas');const img=q?.querySelector('img');const href=canvas?.toDataURL('image/png')||img?.src;if(!href)return toast('לא הצלחתי להכין QR להורדה');const a=document.createElement('a');a.href=href;a.download=filename;a.click()}

function guestInput(i){
  const star=i.required?' *':'';
  if(i.code==='guest_name')return `<div class="field"><label class="label">${esc(i.label)}${star}</label><input class="input" name="guest_name" maxlength="100" placeholder="${esc(i.placeholder||'')}" ${i.required?'required':''}></div>`;
  if(i.code==='long_text')return `<div class="field"><label class="label">${esc(i.label)}${star}</label><textarea class="textarea" name="long_text" maxlength="2000" placeholder="${esc(i.placeholder||'')}" ${i.required?'required':''}></textarea></div>`;
  if(i.code==='reaction'){const o=(i.settings?.options||[]).map(x=>`<label class="reaction"><input type="radio" name="reaction" value="${esc(x.id)}"><span>${esc(x.emoji)} ${esc(x.label)}</span></label>`).join('');return `<div class="field"><div class="label">${esc(i.label)}${star}</div><div class="reactions">${o}</div></div>`}
  if(i.code==='photo')return `<div class="field"><label class="label">${esc(i.label)}${star}</label><input name="photo" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif"><span class="help">תמונה אחת, עד 15MB</span></div>`;
  return ''
}

async function renderGuest(slug){
  app.className='wrap';app.innerHTML='<div class="loading">טוען אירוע...</div>';
  try{
    const d=await edge(API+'?action=config&slug='+encodeURIComponent(slug));
    const e=d.event;
    app.innerHTML=`<section class="card"><header class="hero"><h1>${esc(e.title)}</h1><p>${esc(e.description||'')}</p></header><div class="content">${!d.active?'<div class="msg">האירוע אינו פתוח כרגע לשליחות.</div>':`<form id="guestForm">${d.inputs.map(guestInput).join('')}<div id="guestMsg"></div><button class="btn" id="guestSubmit">שלחו ❤️</button></form>`}</div></section>`;
    const f=document.getElementById('guestForm');if(!f)return;
    f.onsubmit=async ev=>{
      ev.preventDefault();const b=document.getElementById('guestSubmit'),m=document.getElementById('guestMsg');b.disabled=true;b.textContent='שולח...';m.innerHTML='';
      try{const result=await edge(API+'?action=submit&slug='+encodeURIComponent(slug),{method:'POST',body:new FormData(f)});if(!result.accessToken)throw Error('לא התקבל קישור אישי');go('/card/'+encodeURIComponent(result.accessToken))}
      catch(err){m.innerHTML=`<div class="msg err">${esc(err.message)}</div>`;b.disabled=false;b.textContent='שלחו ❤️'}
    }
  }catch(err){app.innerHTML=`<div class="msg err">${esc(err.message)}</div>`}
}

function renderAuth(){
  app.className='wrap auth';
  app.innerHTML=`<section class="card"><div class="content"><div class="center"><h1>ניהול אירועים</h1><p class="small">כניסה לעובדי הארגון</p></div><div id="authMsg"></div><div class="field"><label class="label">אימייל</label><input class="input" id="email" type="email" autocomplete="email"></div><div class="field"><label class="label">סיסמה</label><input class="input" id="password" type="password" minlength="6" autocomplete="current-password"></div><div class="row"><button class="btn grow" id="signIn">התחברות</button><button class="btn secondary grow" id="signUp">הפעלת חשבון עובד</button></div></div></section>`;
  const msg=t=>document.getElementById('authMsg').innerHTML=`<div class="msg">${esc(t)}</div>`;
  document.getElementById('signIn').onclick=async()=>{const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;const {error}=await supabase.auth.signInWithPassword({email,password});if(error)return msg(error.message);orgContext=null;go('/manager')};
  document.getElementById('signUp').onclick=async()=>{const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;if(!email||password.length<6)return msg('יש להזין אימייל וסיסמה של לפחות 6 תווים.');const {data,error}=await supabase.auth.signUp({email,password});if(error)return msg(error.message);if(data.session){orgContext=null;go('/manager')}else msg('החשבון נוצר. אם נשלח מייל אימות, יש לאשר אותו ואז להתחבר. הגישה תיפתח רק אם הסופר־מנהל הגדיר את האימייל הזה כעובד.')};
}

async function renderDashboard(){
  const ctx=await requireOrg();if(!ctx)return;const s=ctx.session;
  app.className='wrap';app.innerHTML='<div class="loading">טוען Dashboard...</div>';
  const {data:events,error}=await supabase.from('events').select('id,name,title,slug,status,event_date,submission_start_at,submission_end_at,created_at').is('deleted_at',null).order('created_at',{ascending:false});
  if(error){app.innerHTML=`<div class="msg err">${esc(error.message)}</div>`;return}
  const ids=events.map(e=>e.id);let counts={};
  if(ids.length){const {data}=await supabase.from('submissions').select('event_id,moderation_status').in('event_id',ids).eq('status','submitted').is('deleted_at',null);for(const x of data||[]){counts[x.event_id]??={total:0,pending:0,approved:0,rejected:0};counts[x.event_id].total++;counts[x.event_id][x.moderation_status]++}}
  const cards=events.map(e=>{const c=counts[e.id]||{total:0,pending:0,approved:0,rejected:0};const state=eventOpenState(e);const date=e.event_date?new Date(e.event_date+'T12:00:00').toLocaleDateString('he-IL'):'';return `<article class="event-card"><div class="row" style="justify-content:space-between"><div><h3>${esc(e.title)}</h3><div class="small">${date?esc(date)+' · ':''}${state?esc(state)+' · ':''}<span class="event-link">${esc(e.slug)}</span></div></div><span class="badge ${esc(e.status)}">${formatStatus(e.status)}</span></div><div class="stats"><span class="pill">סה״כ ${c.total}</span><span class="pill">ממתינות ${c.pending}</span><span class="pill">אושרו ${c.approved}</span><span class="pill">נדחו ${c.rejected}</span></div><div class="row"><button class="btn secondary" data-edit="${e.id}">עריכה</button><button class="btn secondary" data-subs="${e.id}">שליחות</button>${e.status==='published'?`<button class="btn secondary" data-open="${esc(e.slug)}">עמוד אורחים</button><button class="btn secondary" data-copy="${esc(e.slug)}">העתקת קישור</button>`:''}</div></article>`}).join('');
  app.innerHTML=`<div class="top"><div><div class="small">${esc(ctx.org?.name||'הארגון')} · ${ctx.member.role==='super_admin'?'סופר־מנהל':'מנהל אירועים'} · ${esc(s.user.email||'')}</div><h1>אירועי הארגון</h1><div class="small">${events.length} אירועים</div><div class="navrow">${ctx.member.role==='super_admin'?'<button class="btn secondary" id="teamBtn">עובדים</button><button class="btn secondary" id="settingsBtn">הגדרות ארגון</button>':''}</div></div><div class="row"><button class="btn" id="newEvent">+ אירוע חדש</button><button class="btn secondary" id="logout">התנתקות</button></div></div><div class="grid">${cards||'<div class="msg">עדיין אין אירועים בארגון. צור את האירוע הראשון.</div>'}</div>`;
  const newBtn=document.getElementById('newEvent');newBtn.onclick=async()=>{newBtn.disabled=true;newBtn.textContent='יוצר...';await createEvent();newBtn.disabled=false;newBtn.textContent='+ אירוע חדש'};
  document.getElementById('logout').onclick=async()=>{await supabase.auth.signOut();orgContext=null;go('/manager')};
  document.getElementById('teamBtn')?.addEventListener('click',()=>go('/manager/team'));
  document.getElementById('settingsBtn')?.addEventListener('click',()=>go('/manager/settings'));
  document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>go('/manager/event/'+b.dataset.edit));
  document.querySelectorAll('[data-subs]').forEach(b=>b.onclick=()=>go('/manager/event/'+b.dataset.subs+'/submissions'));
  document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>window.open('/e/'+b.dataset.open,'_blank'));
  document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>copyText(guestUrl(b.dataset.copy)));
}

async function createEvent(){
  const ctx=await requireOrg();if(!ctx)return;const s=ctx.session;
  const {data:types,error:tErr}=await supabase.from('event_types').select('id,code,name').eq('is_active',true).order('sort_order');
  if(tErr)return alert(tErr.message);
  const type=types.find(t=>t.code==='other')||types[0];if(!type)return alert('לא נמצאו סוגי אירועים');
  const cfg=ctx.settings||{},windowDays=Number(cfg.default_submission_window_days||30);
  const now=new Date(),end=new Date(now.getTime()+windowDays*86400000),slug='event-'+crypto.randomUUID().slice(0,8);
  const {data:e,error}=await supabase.from('events').insert({
    organization_id:ctx.member.organization_id,
    created_by_user_id:s.user.id,
    owner_user_id:s.user.id,
    event_type_id:type.id,name:'אירוע חדש',title:'אירוע חדש',
    submission_start_at:now.toISOString(),submission_end_at:end.toISOString(),
    timezone:cfg.timezone||'Asia/Jerusalem',language:cfg.language||'he',slug,status:'draft'
  }).select().single();
  if(error)return alert(error.message);
  const {data:its,error:iErr}=await supabase.from('input_types').select('id,code').order('sort_order');if(iErr)return alert(iErr.message);
  const globalInputs=cfg.default_input_config||{};
  const defs={
    guest_name:{enabled:true,required:true,sort_order:1,label:'השם שלכם',placeholder:'איך קוראים לכם?',help_text:null,settings:{max_length:100,min_length:1}},
    long_text:{enabled:true,required:false,sort_order:2,label:'כתבו ברכה',placeholder:'כתבו כאן את הברכה שלכם...',help_text:null,settings:{max_length:2000}},
    photo:{enabled:true,required:false,sort_order:3,label:'הוסיפו תמונה',placeholder:null,help_text:'צלמו עכשיו או בחרו תמונה מהגלריה',settings:{max_files:1}},
    video:{enabled:false,required:false,sort_order:4,label:'הוסיפו סרטון',placeholder:null,help_text:'בקרוב',settings:{max_files:1,max_duration_seconds:60}},
    reaction:{enabled:true,required:false,sort_order:5,label:'בחרו תגובה',placeholder:null,help_text:'איך אתם מרגישים?',settings:{options:[{id:'love',emoji:'❤️',label:'אוהבים אתכם'},{id:'mazal_tov',emoji:'🎉',label:'מזל טוב!'},{id:'cheers',emoji:'🥂',label:'לחיים!'}],selection_mode:'single'}},
    drawing:{enabled:false,required:false,sort_order:6,label:'השאירו את החותם שלכם',placeholder:null,help_text:'בקרוב',settings:{background:'transparent'}}
  };
  for(const code of Object.keys(defs)){if(globalInputs[code]){defs[code].enabled=!!globalInputs[code].enabled;defs[code].required=!!globalInputs[code].required}if(code==='guest_name'){defs[code].enabled=true;defs[code].required=true}}
  const rows=its.map(t=>({event_id:e.id,input_type_id:t.id,...defs[t.code]}));const x=await supabase.from('event_inputs').insert(rows);if(x.error)return alert(x.error.message);
  await supabase.from('event_output_config').insert({event_id:e.id,generation_mode:'none',post_submission_mode:'confirmation'});
  go('/manager/event/'+e.id)
}

let editorState=null,step=1;
async function loadEditor(id){
  const s=await requireSession();if(!s)return;
  const [ev,ins,out,types,templates]=await Promise.all([
    supabase.from('events').select('*').eq('id',id).maybeSingle(),
    supabase.from('event_inputs').select('id,enabled,required,sort_order,label,placeholder,help_text,settings,input_types!inner(code,name,component_type,supports_required)').eq('event_id',id).order('sort_order'),
    supabase.from('event_output_config').select('*').eq('event_id',id).maybeSingle(),
    supabase.from('event_types').select('id,code,name').eq('is_active',true).order('sort_order'),
    supabase.from('card_templates').select('id,name').eq('active',true).order('id')
  ]);
  if(ev.error||!ev.data){app.innerHTML='<div class="msg err">אירוע לא נמצא</div>';return}
  editorState={event:ev.data,inputs:(ins.data||[]).map(x=>({...x,input_type:Array.isArray(x.input_types)?x.input_types[0]:x.input_types})),output:out.data,types:types.data||[],templates:templates.data||[]};
  step=1;renderEditor()
}

function renderEditor(){
  const e=editorState.event;
  const typeOptions=editorState.types.map(t=>`<option value="${t.id}" ${t.id===e.event_type_id?'selected':''}>${esc(t.name)}</option>`).join('');
  const inputRows=editorState.inputs.map(i=>{const disabled=['video','drawing'].includes(i.input_type.code);return `<div class="switchrow"><div><strong>${esc(i.label)}</strong><div class="small">${esc(i.input_type.name)}${disabled?' · בקרוב':''}</div></div><div class="row"><label><input type="checkbox" data-enabled="${i.id}" ${i.enabled?'checked':''} ${disabled?'disabled':''}> פעיל</label><label><input type="checkbox" data-required="${i.id}" ${i.required?'checked':''} ${i.input_type.code==='guest_name'?'disabled':''}> חובה</label></div></div>`}).join('');
  app.className='wrap';
  app.innerHTML=`<div class="top"><div><button class="btn secondary" id="backDash">← Dashboard</button><h1>${esc(e.title)}</h1><div class="small">סטטוס: ${formatStatus(e.status)}</div></div><button class="btn secondary" id="openSubs">שליחות</button></div>
  <div class="tabs">${[1,2,3,4,5].map((n,i)=>`<button class="tab ${step===n?'active':''}" data-step="${n}">${n}. ${['פרטים','זמינות וקישור','טופס אורחים','אחרי שליחה','Preview ופרסום'][i]}</button>`).join('')}</div>
  <section class="card"><div class="content">
    <div class="step ${step===1?'active':''}" data-pane="1"><div class="row"><div class="field grow"><label class="label">שם פנימי</label><input class="input" id="name" value="${esc(e.name)}"></div><div class="field grow"><label class="label">סוג אירוע</label><select class="select" id="eventType">${typeOptions}</select></div></div><div class="field"><label class="label">כותרת לאורחים</label><input class="input" id="title" value="${esc(e.title)}"></div><div class="field"><label class="label">תיאור</label><textarea class="textarea" id="description">${esc(e.description||'')}</textarea></div><div class="field"><label class="label">תאריך אירוע</label><input class="input" type="date" id="eventDate" value="${esc(e.event_date||'')}"></div></div>
    <div class="step ${step===2?'active':''}" data-pane="2"><div class="row"><div class="field grow"><label class="label">פתיחת שליחות</label><input class="input" type="datetime-local" id="startAt" value="${localInputValue(e.submission_start_at)}"></div><div class="field grow"><label class="label">סגירת שליחות</label><input class="input" type="datetime-local" id="endAt" value="${localInputValue(e.submission_end_at)}"></div></div><div class="field"><label class="label">כתובת האירוע</label><div class="row"><span class="small" style="padding-top:12px">/e/</span><input class="input grow" id="slug" value="${esc(e.slug)}"></div><span class="help">אותיות באנגלית, מספרים ומקפים בלבד.</span></div></div>
    <div class="step ${step===3?'active':''}" data-pane="3"><p class="small">שם אורח נשאר חובה. וידאו וציור שמורים במודל אך יופעלו בגרסה הבאה.</p>${inputRows}</div>
    <div class="step ${step===4?'active':''}" data-pane="4"><h2>כרטיסי ברכה לאורחים</h2><p class="small">לאחר שליחה האורח ירכיב כרטיס אישי, יבחר גרסה וישמור קישור פרטי. ספר דיגיטלי ואישור מנהל יטופלו בנפרד.</p><div class="field"><label class="label">מכסת ניסיונות עיצוב (1–20)</label><input class="input" type="number" id="maxAttempts" min="1" max="20" value="${Number(editorState.output?.max_design_attempts||4)}"><span class="help">יצירת כרטיס ראשון ו״נסה עיצוב אחר״ צורכים ניסיון; תיקונים אינם צורכים ניסיון.</span></div><div class="field"><label class="label">עיצובים מותרים באירוע</label>${editorState.templates.map(t=>`<label class="switchrow"><span>${esc(t.name)}</span><input type="checkbox" data-template="${esc(t.id)}" ${editorState.output?.card_template_ids?.includes(t.id)?'checked':''}></label>`).join('')}<span class="help">חייב להישאר לפחות עיצוב אחד. העיצוב הראשון שייבחר ישמש ברירת מחדל.</span></div><div class="field"><label class="label">המלצת AI ועוזר כתיבה</label><div class="msg">כעת פועל Renderer דטרמיניסטי. ה־AI עדיין לא מחובר; הוא לא משנה תמונות או מלל.</div></div></div>
    <div class="step ${step===5?'active':''}" data-pane="5"><div class="preview"><span class="badge ${esc(e.status)}">${formatStatus(e.status)}</span><h2>${esc(e.title)}</h2><p>${esc(e.description||'')}</p><p class="small">מצב: ${esc(eventOpenState(e)||'טיוטה')}</p><p class="small event-link">${esc(guestUrl(e.slug))}</p><div id="qr" class="qrbox"></div><div class="row" style="margin-top:14px"><button class="btn secondary" id="copyGuestLink">העתקת קישור</button><button class="btn secondary" id="downloadQr">הורדת QR</button><button class="btn secondary" id="previewGuest">פתיחת עמוד אורחים</button></div></div><div id="publishMsg" style="margin-top:14px"></div></div>
    <div class="actions"><button class="btn secondary" id="prev" ${step===1?'disabled':''}>הקודם</button><div class="row"><button class="btn secondary" id="save">שמירה</button>${step===5?`<button class="btn" id="publish">${e.status==='published'?'שמירה ופרסום מחדש':'פרסום האירוע'}</button>`:`<button class="btn" id="next">הבא</button>`}</div></div>
  </div></section>`;

  document.getElementById('backDash').onclick=()=>go('/manager');
  document.getElementById('openSubs').onclick=()=>go('/manager/event/'+e.id+'/submissions');
  document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{step=Number(b.dataset.step);renderEditor()});
  document.getElementById('prev').onclick=()=>{step--;renderEditor()};
  document.getElementById('next')?.addEventListener('click',async()=>{if(await saveEditor()){step++;renderEditor()}});
  document.getElementById('save').onclick=saveEditor;
  document.getElementById('publish')?.addEventListener('click',publishEditor);
  if(step===5&&window.QRCode){const q=document.getElementById('qr');new QRCode(q,{text:guestUrl(e.slug),width:150,height:150});document.getElementById('copyGuestLink').onclick=()=>copyText(guestUrl(e.slug));document.getElementById('downloadQr').onclick=()=>downloadQr('qr',e.slug+'-qr.png');document.getElementById('previewGuest').onclick=()=>window.open('/e/'+e.slug,'_blank')}
}

async function saveEditor(){
  const e=editorState.event;
  if(step===1){
    const patch={name:document.getElementById('name').value.trim(),title:document.getElementById('title').value.trim(),description:document.getElementById('description').value.trim()||null,event_date:document.getElementById('eventDate').value||null,event_type_id:document.getElementById('eventType').value,updated_at:new Date().toISOString()};
    if(!patch.title){alert('חסרה כותרת');return false}
    const {error}=await supabase.from('events').update(patch).eq('id',e.id);if(error){alert(error.message);return false}Object.assign(e,patch)
  }
  if(step===2){
    const slug=slugify(document.getElementById('slug').value),start=toIso(document.getElementById('startAt').value),end=toIso(document.getElementById('endAt').value);
    if(!slug){alert('קישור לא תקין');return false}if(!start||!end||new Date(end)<=new Date(start)){alert('מועד הסיום חייב להיות אחרי מועד ההתחלה');return false}
    const {data:dup}=await supabase.from('events').select('id').eq('slug',slug).neq('id',e.id).maybeSingle();if(dup){alert('הקישור הזה כבר תפוס');return false}
    const patch={slug,submission_start_at:start,submission_end_at:end,updated_at:new Date().toISOString()};const {error}=await supabase.from('events').update(patch).eq('id',e.id);if(error){alert(error.message);return false}Object.assign(e,patch)
  }
  if(step===3){
    for(const i of editorState.inputs){
      const enabled=i.input_type.code==='guest_name'?true:!!document.querySelector('[data-enabled="'+i.id+'"]')?.checked;
      const required=i.input_type.code==='guest_name'?true:!!document.querySelector('[data-required="'+i.id+'"]')?.checked;
      const {error}=await supabase.from('event_inputs').update({enabled,required,updated_at:new Date().toISOString()}).eq('id',i.id).eq('event_id',e.id);if(error){alert(error.message);return false}i.enabled=enabled;i.required=required;
    }
  }
  if(step===4&&editorState.output){
    const ids=[...document.querySelectorAll('[data-template]:checked')].map(x=>x.dataset.template);
    const max=Number(document.getElementById('maxAttempts').value);
    if(!ids.length){alert('יש לבחור לפחות עיצוב אחד');return false}
    if(!Number.isInteger(max)||max<1||max>20){alert('יש לבחור בין ניסיון אחד לעשרים');return false}
    const patch={card_template_ids:ids,card_default_template_id:ids[0],max_design_attempts:max,
      post_submission_mode:'confirmation',generation_mode:'none',updated_at:new Date().toISOString()};
    const {error}=await supabase.from('event_output_config').update(patch).eq('event_id',e.id);
    if(error){alert(error.message);return false}Object.assign(editorState.output,patch);
  }
  return true
}

async function publishEditor(){
  if(!await saveEditor())return;
  const e=editorState.event;
  const nameInput=editorState.inputs.find(i=>i.input_type.code==='guest_name');if(!nameInput?.enabled||!nameInput?.required){alert('שם האורח חייב להיות פעיל וחובה');return}
  const {error}=await supabase.from('events').update({status:'published',published_at:e.published_at||new Date().toISOString(),updated_at:new Date().toISOString()}).eq('id',e.id);if(error)return alert(error.message);
  e.status='published';renderEditor();document.getElementById('publishMsg').innerHTML=`<div class="msg ok">האירוע פורסם בהצלחה והוא זמין בקישור הציבורי.</div>`
}

async function renderSubmissions(eventId){
  const s=await requireSession();if(!s)return;
  app.className='wrap';app.innerHTML='<div class="loading">טוען שליחות...</div>';
  const {data:e}=await supabase.from('events').select('id,title,slug,submission_end_at').eq('id',eventId).maybeSingle();if(!e){app.innerHTML='<div class="msg err">אירוע לא נמצא</div>';return}
  const {data:subs,error}=await supabase.from('submissions').select('id,submitted_at,moderation_status,submission_values(text_value,json_value,event_inputs(input_types(code))),media(id,media_type,storage_key)').eq('event_id',eventId).eq('status','submitted').is('deleted_at',null).order('submitted_at',{ascending:false});
  if(error){app.innerHTML=`<div class="msg err">${esc(error.message)}</div>`;return}
  const rows=[];
  for(const x of subs||[]){let name='',greeting='',reaction='';for(const v of x.submission_values||[]){const ei=Array.isArray(v.event_inputs)?v.event_inputs[0]:v.event_inputs;const it=Array.isArray(ei?.input_types)?ei.input_types[0]:ei?.input_types;if(it?.code==='guest_name')name=v.text_value||'';if(it?.code==='long_text')greeting=v.text_value||'';if(it?.code==='reaction'){const o=v.json_value?.selected?.[0];reaction=o?`${o.emoji||''} ${o.label||''}`:''}}let media=[];for(const m of x.media||[]){const {data}=await supabase.storage.from('guest-media').createSignedUrl(m.storage_key,3600);if(data?.signedUrl)media.push({type:m.media_type,url:data.signedUrl})}rows.push({...x,name,greeting,reaction,media})}
  const ids=(subs||[]).map(x=>x.id);
  const {data:requests,error:requestsError}=ids.length
    ?await supabase.from('card_deletion_requests').select('id,submission_id,note,created_at,status').in('submission_id',ids).eq('status','pending').order('created_at',{ascending:false})
    :{data:[],error:null};
  if(requestsError){app.innerHTML=`<div class="msg err">${esc(requestsError.message)}</div>`;return}
  const counts={all:rows.length,pending:0,approved:0,rejected:0};rows.forEach(r=>counts[r.moderation_status]++);
  const deletionQueue=(requests||[]).map(r=>{const row=rows.find(x=>x.id===r.submission_id);return `<article class="submission"><strong>${esc(row?.name||'אורח')}</strong><p class="small">${new Date(r.created_at).toLocaleString('he-IL')}</p><p>${esc(r.note||'בקשת הסרת הכרטיס האישי')}</p><div class="row"><button class="btn danger" data-resolve="${r.id}" data-decision="accepted">אשרו מחיקה</button><button class="btn secondary" data-resolve="${r.id}" data-decision="declined">דחו בקשה</button></div></article>`}).join('');
  const moderationAllowed=Date.now()>=new Date(e.submission_end_at).getTime();
  const card=r=>`<article class="submission" data-status="${esc(r.moderation_status)}"><div class="sub-top"><div><strong>${esc(r.name||'ללא שם')}</strong><div class="small">${new Date(r.submitted_at).toLocaleString('he-IL')}</div></div><span class="badge status ${esc(r.moderation_status)}">${r.moderation_status==='approved'?'אושר':r.moderation_status==='rejected'?'נדחה':'ממתין'}</span></div>${r.greeting?`<p>${esc(r.greeting)}</p>`:''}${r.reaction?`<p>${esc(r.reaction)}</p>`:''}${r.media.map(m=>`<img class="thumb" src="${esc(m.url)}" alt="תמונה שצורפה לשליחה">`).join('')}<div class="row" style="margin-top:12px">${moderationAllowed?`<button class="btn secondary" data-mod="approved" data-id="${r.id}" ${r.moderation_status==='approved'?'disabled':''}>✓ אישור</button><button class="btn secondary" data-mod="rejected" data-id="${r.id}" ${r.moderation_status==='rejected'?'disabled':''}>✕ דחייה</button><button class="btn secondary" data-mod="pending" data-id="${r.id}" ${r.moderation_status==='pending'?'disabled':''}>↺ להמתנה</button>`:''}</div></article>`;
  app.innerHTML=`<div class="top"><div><button class="btn secondary" id="backEvent">← לאירוע</button><h1>שליחות — ${esc(e.title)}</h1><div class="small">${rows.length} שליחות</div></div><div class="row"><button class="btn secondary" id="copyLink">העתקת קישור</button><button class="btn secondary" id="guestPage">עמוד אורחים</button></div></div><div class="toolbar"><button class="filter active" data-filter="all">הכול ${counts.all}</button><button class="filter" data-filter="pending">ממתינות ${counts.pending}</button><button class="filter" data-filter="approved">אושרו ${counts.approved}</button><button class="filter" data-filter="rejected">נדחו ${counts.rejected}</button></div><div class="msg">${moderationAllowed?'חלון השליחה הסתיים; אישור כרטיסים לספר הדיגיטלי הוא תהליך נפרד.':'אישור הכרטיסים לצורך הספר הדיגיטלי יתאפשר רק אחרי סגירת חלון השליחה.'}</div><div id="subs">${rows.map(card).join('')||'<div class="msg">אין עדיין שליחות.</div>'}</div><section class="card" style="margin-top:24px"><div class="content"><h2>בקשות מחיקה ${(requests||[]).length}</h2>${deletionQueue||'<p class="small">אין בקשות מחיקה פתוחות.</p>'}</div></section>`;
  document.getElementById('backEvent').onclick=()=>go('/manager/event/'+eventId);document.getElementById('guestPage').onclick=()=>window.open('/e/'+e.slug,'_blank');document.getElementById('copyLink').onclick=()=>copyText(guestUrl(e.slug));
  document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));const f=b.dataset.filter;document.querySelectorAll('.submission').forEach(c=>c.style.display=f==='all'||c.dataset.status===f?'':'none')});
  document.querySelectorAll('[data-resolve]').forEach(b=>b.onclick=async()=>{
    const decision=b.dataset.decision;
    if(decision==='accepted'&&!confirm('אישור הבקשה יסיר את הברכה מהגישה האישית. להמשיך?'))return;
    b.disabled=true;
    const {error}=await supabase.rpc('resolve_card_deletion_request',{p_request_id:b.dataset.resolve,p_decision:decision});
    if(error){alert(error.message);b.disabled=false}else{toast('בקשת המחיקה עודכנה');renderSubmissions(eventId)}
  });
  document.querySelectorAll('[data-mod]').forEach(b=>b.onclick=async()=>{const status=b.dataset.mod,id=b.dataset.id;b.disabled=true;const patch={moderation_status:status,moderated_at:status==='pending'?null:new Date().toISOString(),moderated_by_user_id:status==='pending'?null:s.user.id,updated_at:new Date().toISOString()};const {error}=await supabase.from('submissions').update(patch).eq('id',id).eq('event_id',eventId);if(error){alert(error.message);b.disabled=false}else{toast('הסטטוס עודכן');renderSubmissions(eventId)}})
}

async function renderOrgSettings(){

  const cfg=settings.default_input_config||{};
  const row=(code,label)=>`<div class="switchrow"><strong>${label}</strong><div class="row"><label><input type="checkbox" data-global-enabled="${code}" ${cfg[code]?.enabled?'checked':''} ${code==='guest_name'?'disabled':''}> פעיל</label><label><input type="checkbox" data-global-required="${code}" ${cfg[code]?.required?'checked':''} ${code==='guest_name'?'disabled':''}> חובה</label></div></div>`;
  app.className='wrap';app.innerHTML=`<div class="top"><div><button class="btn secondary" id="settingsBack">← Dashboard</button><h1>הגדרות ארגון</h1><div class="small">הגדרות אלה משמשות כברירת מחדל לאירועים חדשים.</div></div></div><section class="card"><div class="content"><div class="field"><label class="label">שם הארגון</label><input class="input" id="orgName" value="${esc(ctx.org?.name||'')}"></div><div class="row"><div class="field grow"><label class="label">אזור זמן</label><select class="select" id="orgTimezone"><option value="Asia/Jerusalem" selected>Asia/Jerusalem</option></select></div><div class="field grow"><label class="label">שפה</label><select class="select" id="orgLanguage"><option value="he" selected>עברית</option></select></div><div class="field grow"><label class="label">חלון שליחה ברירת מחדל (ימים)</label><input class="input" id="windowDays" type="number" min="1" max="365" value="${Number(settings.default_submission_window_days||30)}"></div></div><h2>טופס אורחים ברירת מחדל</h2>${row('guest_name','שם אורח')}${row('long_text','ברכה')}${row('photo','תמונה')}${row('reaction','תגובה')}${row('video','וידאו — בקרוב')}${row('drawing','ציור — בקרוב')}<div class="actions"><span></span><button class="btn" id="saveOrgSettings">שמירת הגדרות</button></div></div></section>`;
  document.getElementById('settingsBack').onclick=()=>go('/manager');
  document.getElementById('saveOrgSettings').onclick=async()=>{const name=document.getElementById('orgName').value.trim();const windowDays=Math.max(1,Math.min(365,Number(document.getElementById('windowDays').value||30)));const next={};['guest_name','long_text','photo','reaction','video','drawing'].forEach(code=>{next[code]={enabled:code==='guest_name'?true:!!document.querySelector('[data-global-enabled="'+code+'"]')?.checked,required:code==='guest_name'?true:!!document.querySelector('[data-global-required="'+code+'"]')?.checked}});const [a,b]=await Promise.all([supabase.from('organizations').update({name:name||'הארגון שלי',updated_at:new Date().toISOString()}).eq('id',ctx.member.organization_id),supabase.from('organization_settings').update({timezone:'Asia/Jerusalem',language:'he',default_submission_window_days:windowDays,default_input_config:next,updated_at:new Date().toISOString()}).eq('organization_id',ctx.member.organization_id)]);if(a.error||b.error)return alert(a.error?.message||b.error?.message);orgContext=null;toast('ההגדרות נשמרו');setTimeout(()=>renderOrgSettings(),300)}
}

async function route(){
  const path=currentPath();
  const qs=currentQuery();
  const adminToken=qs.get('admin');
  if(adminToken){location.href='/manager';return}
  if(path==='/manager'){await renderDashboard();return}
  if(path==='/manager/team'){await renderTeam();return}
  if(path==='/manager/settings'){await renderOrgSettings();return}
  const sm=path.match(/^\/manager\/event\/([0-9a-f-]{36})\/submissions$/i);if(sm){await renderSubmissions(sm[1]);return}
  const em=path.match(/^\/manager\/event\/([0-9a-f-]{36})$/i);if(em){await loadEditor(em[1]);return}
  const pc=path.match(/^\/card\/([0-9a-f]{64})$/i);if(pc){await renderGuestCardPage({token:pc[1],app,api:CARD_API,go});return}
  const gm=path.match(/^\/e\/([^/]+)$/);if(gm){await renderGuest(decodeURIComponent(gm[1]));return}
  await renderGuest('demo')
}
supabase.auth.onAuthStateChange(()=>{});
route();
</script>
